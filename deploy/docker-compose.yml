# IM 即时通讯系统本地依赖：MySQL 8 + Redis 7 + RabbitMQ 4
# 启动：docker compose -f deploy/docker-compose.yml up -d
name: imchat

services:
  mysql:
    image: mysql:8.0
    container_name: imchat-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: imchat
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=1000
      - --innodb_buffer_pool_size=512M
      - --innodb_flush_log_at_trx_commit=2
      - --sync_binlog=0
      - --slow_query_log=1
      - --long_query_time=0.2
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: imchat-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --tcp-backlog
      - "2048"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 768M

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: imchat-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: imchat
      RABBITMQ_DEFAULT_PASS: imchat123456
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # 管理台 http://127.0.0.1:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
