<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IMChat · 即时通讯</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e6e8eb;
    --text: #1c1f23;
    --text-2: #6b7280;
    --text-3: #9aa1ab;
    --primary: #2b7fff;
    --primary-soft: #eaf2ff;
    --danger: #e5484d;
    --success: #12a150;
    --mine: #2b7fff;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 4px 16px rgba(16, 24, 40, .04);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea { font-family: inherit; font-size: 14px; outline: none; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #d4d7dc; border-radius: 3px; }

  /* ---------- 登录 ---------- */
  #login {
    height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #eef4ff 0%, #f7f9fc 50%, #eef7f2 100%);
  }
  .login-card {
    width: 380px; background: var(--panel); border-radius: 18px; padding: 36px 32px;
    box-shadow: 0 12px 40px rgba(16, 24, 40, .08);
  }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .logo-mark {
    width: 34px; height: 34px; border-radius: 10px; background: var(--primary);
    display: grid; place-items: center; color: #fff; font-weight: 700;
  }
  .logo h1 { font-size: 19px; letter-spacing: .3px; }
  .sub { color: var(--text-3); font-size: 12px; margin-bottom: 24px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 6px; }
  .field input {
    width: 100%; height: 42px; padding: 0 12px; border: 1px solid var(--border);
    border-radius: 10px; transition: .15s; background: #fbfcfd;
  }
  .field input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(43,127,255,.1); }
  .btn {
    height: 42px; width: 100%; border-radius: 10px; background: var(--primary); color: #fff;
    font-weight: 600; transition: .15s;
  }
  .btn:hover { filter: brightness(1.05); }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .btn.ghost { background: var(--primary-soft); color: var(--primary); }
  .btn.sm { height: 32px; width: auto; padding: 0 14px; font-size: 13px; border-radius: 8px; }
  .btn.danger { background: #feeceb; color: var(--danger); }
  .switch { text-align: center; margin-top: 16px; font-size: 13px; color: var(--text-2); }
  .switch a { color: var(--primary); cursor: pointer; }
  .err { color: var(--danger); font-size: 12px; margin-top: 10px; min-height: 16px; }

  /* ---------- 主界面 ---------- */
  #app { display: none; height: 100vh; overflow: hidden; }
  #app.on { display: flex; }
  .sidebar {
    width: 320px; background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  .me-bar { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .avatar {
    width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
    color: #fff; font-weight: 600; font-size: 15px; flex-shrink: 0; background: var(--primary);
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar.sm { width: 30px; height: 30px; font-size: 12px; border-radius: 8px; }
  .avatar.lg { width: 54px; height: 54px; font-size: 20px; border-radius: 14px; }
  .me-info { flex: 1; min-width: 0; }
  .me-info b { display: block; font-size: 14px; }
  .me-info span { font-size: 12px; color: var(--text-3); }
  .icon-btn {
    width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center;
    color: var(--text-2); transition: .15s;
  }
  .icon-btn:hover { background: var(--bg); color: var(--text); }

  .tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 8px; }
  .tab {
    flex: 1; height: 42px; font-size: 13px; color: var(--text-2); position: relative; font-weight: 500;
  }
  .tab.on { color: var(--primary); }
  .tab.on::after {
    content: ""; position: absolute; left: 50%; bottom: -1px; transform: translateX(-50%);
    width: 24px; height: 2px; background: var(--primary); border-radius: 2px;
  }
  .list { flex: 1; overflow-y: auto; padding: 6px; }
  .item {
    display: flex; gap: 10px; padding: 10px; border-radius: 10px; cursor: pointer;
    align-items: center; transition: .12s;
  }
  .item:hover { background: #f7f8fa; }
  .item.on { background: var(--primary-soft); }
  .item-main { flex: 1; min-width: 0; }
  .item-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .item-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-time { font-size: 11px; color: var(--text-3); flex-shrink: 0; }
  .item-sub { font-size: 12px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 3px; }
  .badge {
    background: var(--danger); color: #fff; font-size: 11px; min-width: 18px; height: 18px;
    border-radius: 9px; display: grid; place-items: center; padding: 0 5px; font-weight: 600;
  }
  .empty { text-align: center; color: var(--text-3); font-size: 13px; padding: 40px 20px; }

  .search-box { padding: 10px 12px; }
  .search-box input {
    width: 100%; height: 34px; border-radius: 8px; border: 1px solid var(--border);
    padding: 0 10px; background: #fbfcfd; font-size: 13px;
  }

  /* ---------- 聊天区 ---------- */
  .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--panel); }
  .chat-head {
    height: 58px; border-bottom: 1px solid var(--border); display: flex; align-items: center;
    padding: 0 18px; gap: 10px; flex-shrink: 0;
  }
  .chat-head h3 { font-size: 15px; font-weight: 600; }
  .chat-head .meta { font-size: 12px; color: var(--text-3); }
  .chat-body { flex: 1; overflow-y: auto; padding: 18px; background: #fafbfc; }
  .msg-row { display: flex; gap: 10px; margin-bottom: 14px; align-items: flex-start; }
  .msg-row.mine { flex-direction: row-reverse; }
  .msg-col { max-width: min(560px, 68%); display: flex; flex-direction: column; gap: 4px; }
  .msg-row.mine .msg-col { align-items: flex-end; }
  .msg-from { font-size: 11px; color: var(--text-3); padding: 0 2px; }
  .bubble {
    padding: 9px 12px; border-radius: 10px; background: #fff; border: 1px solid var(--border);
    line-height: 1.55; word-break: break-word; white-space: pre-wrap;
  }
  .msg-row.mine .bubble { background: var(--mine); color: #fff; border-color: transparent; }
  .bubble img { max-width: 220px; border-radius: 8px; display: block; }
  .bubble.recalled { background: #f1f2f4; color: var(--text-3); font-style: italic; border-color: transparent; }
  .sys { text-align: center; color: var(--text-3); font-size: 12px; margin: 10px 0; }
  .chat-input { border-top: 1px solid var(--border); padding: 12px 16px; flex-shrink: 0; background: var(--panel); }
  .chat-input-row { display: flex; gap: 10px; align-items: flex-end; }
  .chat-input textarea {
    flex: 1; resize: none; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; height: 42px; max-height: 120px; line-height: 1.4; background: #fbfcfd;
  }
  .chat-input textarea:focus { border-color: var(--primary); background: #fff; }
  .placeholder { flex: 1; display: grid; place-items: center; color: var(--text-3); font-size: 13px; }

  /* ---------- 右侧面板 / 弹层 ---------- */
  .panel { width: 260px; border-left: 1px solid var(--border); background: var(--panel); overflow-y: auto; padding: 14px; }
  .panel h4 { font-size: 13px; color: var(--text-2); margin-bottom: 10px; font-weight: 600; }
  .member { display: flex; align-items: center; gap: 8px; padding: 6px 4px; font-size: 13px; }
  .role-tag {
    font-size: 10px; padding: 1px 6px; border-radius: 4px; background: var(--primary-soft); color: var(--primary);
  }
  .role-tag.owner { background: #fff4e5; color: #b76e00; }

  .modal-mask {
    position: fixed; inset: 0; background: rgba(16, 24, 40, .45); display: none;
    align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  .modal-mask.on { display: flex; }
  .modal {
    background: var(--panel); border-radius: 16px; padding: 24px; width: 460px; max-width: 100%;
    max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(16,24,40,.2);
  }
  .modal h3 { font-size: 16px; margin-bottom: 16px; }
  .modal .field { margin-bottom: 12px; }

  /* ---------- 朋友圈 ---------- */
  .moments { flex: 1; overflow-y: auto; padding: 20px; background: #fafbfc; }
  .moment {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; margin-bottom: 14px; max-width: 720px;
  }
  .moment-head { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  .moment-head b { font-size: 14px; }
  .moment-head span { font-size: 11px; color: var(--text-3); }
  .moment-content { line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
  .moment-images { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .moment-images img { width: 110px; height: 110px; object-fit: cover; border-radius: 8px; cursor: zoom-in; }
  .moment-actions { display: flex; gap: 16px; margin-top: 12px; font-size: 13px; color: var(--text-2); }
  .moment-actions button:hover { color: var(--primary); }
  .moment-actions button.liked { color: var(--danger); }
  .likes { margin-top: 10px; font-size: 13px; color: var(--primary); background: #f6f9ff; padding: 8px 10px; border-radius: 8px; }
  .comments { margin-top: 8px; background: #f7f8fa; border-radius: 8px; padding: 8px 10px; font-size: 13px; }
  .comment { padding: 3px 0; line-height: 1.5; }
  .comment b { color: var(--text-2); font-weight: 500; }
  .comment .del { color: var(--text-3); font-size: 11px; margin-left: 6px; }
  .comment-input { display: flex; gap: 8px; margin-top: 10px; }
  .comment-input input { flex: 1; height: 34px; border: 1px solid var(--border); border-radius: 8px; padding: 0 10px; }

  .row { display: flex; gap: 8px; align-items: center; }
  .muted { color: var(--text-3); font-size: 12px; }
  .spacer { flex: 1; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--bg); color: var(--text-2); }
  .pill.on { background: var(--primary-soft); color: var(--primary); }
  .toast {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
    background: #1c1f23; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: .25s; z-index: 200;
  }
  .toast.on { opacity: .95; }
  .dot-online { width: 7px; height: 7px; border-radius: 50%; background: var(--success); display: inline-block; }
</style>
</head>
<body>

<!-- ============ 登录页 ============ -->
<div id="login">
  <div class="login-card">
    <div class="logo"><div class="logo-mark">IM</div><h1>IMChat</h1></div>
    <div class="sub">Go + Gin + GORM + MySQL + Redis + RabbitMQ</div>
    <div class="field">
      <label>用户名</label>
      <input id="loginUser" placeholder="3-20 位字母数字下划线" autocomplete="username" />
    </div>
    <div class="field">
      <label>密码</label>
      <input id="loginPass" type="password" placeholder="至少 6 位" autocomplete="current-password" />
    </div>
    <div class="field" id="nickField" style="display:none">
      <label>昵称（可选）</label>
      <input id="loginNick" placeholder="不填则用用户名" />
    </div>
    <button class="btn" id="loginBtn">登录</button>
    <div class="err" id="loginErr"></div>
    <div class="switch">
      <span id="switchTip">还没有账号？</span>
      <a id="switchBtn">立即注册</a>
    </div>
  </div>
</div>

<!-- ============ 主界面 ============ -->
<div id="app">
  <aside class="sidebar">
    <div class="me-bar">
      <div id="meAvatarWrap"></div>
      <div class="me-info"><b id="meName">-</b><span id="meStatus">连接中…</span></div>
      <button class="icon-btn" id="editProfileBtn" title="编辑资料">✎</button>
      <button class="icon-btn" id="logoutBtn" title="退出登录">⏏</button>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="convs">会话</button>
      <button class="tab" data-tab="contacts">通讯录</button>
      <button class="tab" data-tab="moments">朋友圈</button>
    </div>

    <!-- 会话 -->
    <div class="list" id="convList"></div>

    <!-- 通讯录 -->
    <div class="list" id="contactList" style="display:none"></div>

    <!-- 朋友圈入口 -->
    <div class="list" id="momentEntry" style="display:none">
      <div class="item" onclick="openMoments()">
        <div class="avatar" style="background:#12a150">◍</div>
        <div class="item-main"><div class="item-name">朋友圈</div><div class="item-sub">查看好友动态</div></div>
      </div>
      <div class="item" onclick="openPublish()">
        <div class="avatar" style="background:#b76e00">✎</div>
        <div class="item-main"><div class="item-name">发表动态</div><div class="item-sub">分享此刻</div></div>
      </div>
    </div>
  </aside>

  <!-- 中间区域 -->
  <main class="chat" id="chatArea">
    <div class="placeholder" id="chatPlaceholder">选择一个会话开始聊天</div>
    <div id="chatInner" style="display:none; flex:1; flex-direction:column; min-height:0">
      <div class="chat-head">
        <div id="chatAvatarWrap"></div>
        <div style="min-width:0">
          <h3 id="chatName">-</h3>
          <div class="meta" id="chatMeta"></div>
        </div>
        <div class="spacer"></div>
        <button class="icon-btn" id="memberBtn" title="群成员" style="display:none">☰</button>
      </div>
      <div class="chat-body" id="msgList"></div>
      <div class="chat-input">
        <div class="chat-input-row">
          <button class="icon-btn" id="imgBtn" title="发送图片">🖼</button>
          <textarea id="msgInput" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
          <button class="btn sm" id="sendBtn" style="height:42px;padding:0 20px">发送</button>
        </div>
      </div>
    </div>
  </main>

  <!-- 群成员面板 -->
  <aside class="panel" id="memberPanel" style="display:none">
    <h4>群成员 <span class="pill" id="memberCount">0</span></h4>
    <div id="memberList"></div>
  </aside>
</div>

<div class="modal-mask" id="modalMask"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="filePicker" accept="image/*" style="display:none" />

<script>
/* =====================================================================
 *  IMChat 前端：原生 JS，无构建步骤。
 *  约定：发送消息走 HTTP（有明确回执），接收走 WebSocket。
 * ===================================================================== */

const API = location.origin + '/api/v1';
const state = {
  token: localStorage.getItem('imchat_token') || '',
  me: null,
  ws: null,
  wsReady: false,
  retry: 0,
  tab: 'convs',
  convs: [],
  current: null,          // { convId, type, targetId, name, avatar, groupId }
  messages: {},           // convId -> [msg]
  friends: [],
  groups: [],
  requests: [],
  blocked: [],
  moments: [],
  wsSendQueue: [],
};

/* ---------------- 基础工具 ---------------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
));

// jsArg 用于把值安全地嵌进 onclick 里的 JS 字符串：
// 先用 JSON.stringify 得到带双引号的字面量，再做 HTML 转义，避免含单引号的内容截断语句
function jsArg(v) {
  return esc(JSON.stringify(String(v == null ? '' : v)));
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('on'), 2000);
}

function avatarHtml(name, avatar, cls) {
  const initial = (name || '?').trim().slice(0, 1).toUpperCase();
  if (avatar && avatar.startsWith('/uploads')) {
    return `<img src="${esc(avatar)}" alt="" />`;
  }
  // 用名字哈希生成稳定色相，视觉上区分不同用户
  let h = 0;
  for (let i = 0; i < (name || '').length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
  return `<div class="${cls}" style="background:hsl(${h},62%,52%)">${esc(initial)}</div>`;
}

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  if (sameDay) return `${hh}:${mm}`;
  return `${d.getMonth() + 1}/${d.getDate()} ${hh}:${mm}`;
}

function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID().replace(/-/g, '');
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

async function api(method, path, body) {
  const opt = { method, headers: { 'Content-Type': 'application/json' } };
  if (state.token) opt.headers.Authorization = 'Bearer ' + state.token;
  if (body !== undefined) opt.body = JSON.stringify(body);
  const res = await fetch(API + path, opt);
  let json = null;
  try { json = await res.json(); } catch (_) { json = { code: res.status, msg: '响应解析失败' }; }
  if (json.code !== 0) {
    if (json.code === 40100 || json.code === 40101) { doLogout(); }
    throw new Error(json.msg || '请求失败');
  }
  return json.data;
}

/* ---------------- 登录 / 注册 ---------------- */
let registerMode = false;
$('switchBtn').onclick = () => {
  registerMode = !registerMode;
  $('nickField').style.display = registerMode ? 'block' : 'none';
  $('loginBtn').textContent = registerMode ? '注册并登录' : '登录';
  $('switchTip').textContent = registerMode ? '已有账号？' : '还没有账号？';
  $('switchBtn').textContent = registerMode ? '去登录' : '立即注册';
  $('loginErr').textContent = '';
};

$('loginBtn').onclick = async () => {
  const username = $('loginUser').value.trim();
  const password = $('loginPass').value;
  const nickname = $('loginNick').value.trim();
  if (!username || !password) { $('loginErr').textContent = '请填写用户名和密码'; return; }
  $('loginBtn').disabled = true;
  $('loginErr').textContent = '';
  try {
    const data = registerMode
      ? await api('POST', '/auth/register', { username, password, nickname })
      : await api('POST', '/auth/login', { username, password, device: 'web' });
    state.token = data.token;
    state.me = data.user;
    localStorage.setItem('imchat_token', data.token);
    enterApp();
  } catch (e) {
    $('loginErr').textContent = e.message;
  } finally {
    $('loginBtn').disabled = false;
  }
};

$('loginPass').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });

function doLogout() {
  api('POST', '/auth/logout').catch(() => {});
  state.token = '';
  localStorage.removeItem('imchat_token');
  state.me = null;
  if (state.ws) { state.ws.onclose = null; state.ws.close(); state.ws = null; }
  $('app').classList.remove('on');
  $('login').style.display = 'flex';
}

$('logoutBtn').onclick = () => {
  if (confirm('确定退出登录？')) doLogout();
};

/* ---------------- 进入主界面 ---------------- */
async function enterApp() {
  $('login').style.display = 'none';
  $('app').classList.add('on');
  $('meName').textContent = state.me.nickname || state.me.username;
  $('meAvatarWrap').innerHTML = avatarHtml(state.me.nickname, state.me.avatar, 'avatar');
  connectWS();
  await loadAll();
}

async function loadAll() {
  await Promise.all([loadConvs(), loadFriends(), loadGroups(), loadRequests()]);
}

/* ---------------- WebSocket ---------------- */
function connectWS() {
  if (!state.token) return;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const url = `${proto}://${location.host}/ws?token=${encodeURIComponent(state.token)}&device=web`;
  const ws = new WebSocket(url);
  state.ws = ws;

  ws.onopen = () => {
    state.wsReady = true;
    state.retry = 0;
    $('meStatus').innerHTML = '<span class="dot-online"></span> 在线';
    // 补发离线期间排队的帧
    while (state.wsSendQueue.length) ws.send(state.wsSendQueue.shift());
  };

  ws.onclose = () => {
    state.wsReady = false;
    $('meStatus').textContent = '连接已断开，重连中…';
    state.retry++;
    const delay = Math.min(1000 * Math.pow(1.6, Math.min(state.retry, 6)), 15000);
    setTimeout(() => { if (state.token) connectWS(); }, delay);
  };

  ws.onerror = () => {};

  ws.onmessage = (ev) => {
    let frame;
    try { frame = JSON.parse(ev.data); } catch (_) { return; }
    handleFrame(frame);
  };

  // 应用层心跳，防止中间代理断开空闲连接
  clearInterval(state._hb);
  state._hb = setInterval(() => {
    if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'ping' }));
  }, 25000);
}

function handleFrame(frame) {
  const { type, data } = frame;
  switch (type) {
    case 'message':
      onIncomingMessage(data);
      break;
    case 'message_recall':
      onRecall(data);
      break;
    case 'read':
      break;
    case 'friend_request':
      toast(`${data.from_user?.nickname || '有人'} 请求添加你为好友`);
      loadRequests();
      break;
    case 'friend_accept':
      toast(`${data.user?.nickname || '对方'} 通过了你的好友申请`);
      loadFriends();
      break;
    case 'group_event':
      loadGroups();
      loadConvs();
      if (state.current && state.current.groupId === Number(data.group_id)) {
        if (['member_join', 'member_leave', 'dissolve'].includes(data.action)) loadMembers(state.current.groupId);
      }
      break;
    case 'notice':
      if (data.kind === 'moment_like') toast('有人赞了你的动态');
      else if (data.kind === 'moment_comment') toast('有人评论了你的动态');
      break;
    case 'kick':
      toast(data.reason || '连接已被断开');
      break;
    case 'error':
      toast(data.msg || '操作失败');
      break;
    case 'pong':
      break;
  }
}

async function openConv(convId, convType, name, avatar, targetId) {
  state.current = { convId, type: convType, name, avatar, targetId, groupId: convType === 2 ? targetId : 0 };
  // 离开朋友圈视图，避免残留 DOM 抢占布局
  $('momentsView')?.remove();
  $('chatPlaceholder').style.display = 'none';
  $('chatInner').style.display = 'flex';
  $('chatName').textContent = name || '会话';
  $('chatAvatarWrap').innerHTML = avatarHtml(name, avatar, 'avatar sm');
  $('memberBtn').style.display = convType === 2 ? 'grid' : 'none';
  if (convType === 2) { loadMembers(targetId); }
  else { $('memberPanel').style.display = 'none'; }

  renderConvs();
  await loadHistory(convId);
  markReadCurrent();
}

async function loadHistory(convId) {
  try {
    const list = await api('GET', `/messages?conv_id=${encodeURIComponent(convId)}&limit=50`);
    state.messages[convId] = list || [];
  } catch (e) {
    state.messages[convId] = [];
  }
  renderMessages();
}

function renderMessages() {
  const convId = state.current && state.current.convId;
  if (!convId) return;
  const list = state.messages[convId] || [];
  const box = $('msgList');
  if (!list.length) {
    box.innerHTML = '<div class="empty">还没有消息，打个招呼吧</div>';
    return;
  }
  const isGroup = state.current.type === 2;
  box.innerHTML = list.map((m) => {
    const mine = m.from_id === state.me.id;
    if (m.msg_type === 4) return `<div class="sys">${esc(m.content)}</div>`;
    if (m.status === 1) return `<div class="sys">${esc(m.from_user?.nickname || '某人')} 撤回了一条消息</div>`;
    let inner = esc(m.content);
    if (m.msg_type === 2) {
      let url = m.content;
      try { const ex = JSON.parse(m.extra || '{}'); if (ex.url) url = ex.url; } catch (_) {}
      inner = `<img src="${esc(url)}" onclick="window.open('${esc(url)}')" />`;
    } else if (m.msg_type === 3) {
      inner = `📎 ${esc(m.content)}`;
    }
    return `
      <div class="msg-row ${mine ? 'mine' : ''}">
        ${avatarHtml(m.from_user?.nickname || '?', m.from_user?.avatar, 'avatar sm')}
        <div class="msg-col">
          ${isGroup && !mine ? `<div class="msg-from">${esc(m.from_user?.nickname || '')}</div>` : ''}
          <div class="bubble">${inner}</div>
        </div>
      </div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

function markReadCurrent() {
  const cur = state.current;
  if (!cur) return;
  const list = state.messages[cur.convId] || [];
  const last = list[list.length - 1];
  if (!last) return;
  api('POST', '/messages/read', { conv_id: cur.convId, seq: last.seq }).catch(() => {});
  const conv = state.convs.find((c) => c.conv_id === cur.convId);
  if (conv) conv.unread = 0;
  renderConvs();
}

/* ---------------- 发送消息 ---------------- */
async function sendMessage() {
  const input = $('msgInput');
  const text = input.value.trim();
  if (!text || !state.current) return;
  const cur = state.current;
  const payload = {
    client_msg_id: uuid(),
    msg_type: 1,
    content: text,
    conv_type: cur.type,
  };
  if (cur.type === 1) payload.to_id = cur.targetId;
  else payload.group_id = cur.groupId;

  input.value = '';
  input.style.height = '42px';
  try {
    const dto = await api('POST', cur.type === 1 ? '/messages/private' : '/messages/group', payload);
    const arr = state.messages[cur.convId] || (state.messages[cur.convId] = []);
    if (!arr.some((m) => m.id === dto.id)) arr.push(dto);
    renderMessages();
    loadConvs();
  } catch (e) {
    toast(e.message);
    input.value = text;
  }
}

$('sendBtn').onclick = sendMessage;
$('msgInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
$('msgInput').addEventListener('input', (e) => {
  e.target.style.height = '42px';
  e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
});
$('imgBtn').onclick = () => $('filePicker').click();
$('filePicker').onchange = async (e) => {
  const file = e.target.files[0];
  if (!file || !state.current) return;
  const fd = new FormData();
  fd.append('file', file);
  try {
    const res = await fetch(API + '/upload', {
      method: 'POST', headers: { Authorization: 'Bearer ' + state.token }, body: fd,
    });
    const json = await res.json();
    if (json.code !== 0) throw new Error(json.msg);
    const cur = state.current;
    const payload = {
      client_msg_id: uuid(), msg_type: 2, content: json.data.url,
      extra: JSON.stringify({ url: json.data.url }), conv_type: cur.type,
    };
    if (cur.type === 1) payload.to_id = cur.targetId; else payload.group_id = cur.groupId;
    const dto = await api('POST', cur.type === 1 ? '/messages/private' : '/messages/group', payload);
    const arr = state.messages[cur.convId] || (state.messages[cur.convId] = []);
    arr.push(dto);
    renderMessages();
  } catch (err) {
    toast(err.message);
  } finally {
    e.target.value = '';
  }
};

/* ---------------- 收到新消息 ---------------- */
function onIncomingMessage(m) {
  if (!m || !m.conv_id) return;
  const arr = state.messages[m.conv_id] || (state.messages[m.conv_id] = []);
  if (!arr.some((x) => x.id === m.id)) arr.push(m);

  const isCurrent = state.current && state.current.convId === m.conv_id;
  if (isCurrent) {
    renderMessages();
    if (document.visibilityState === 'visible') markReadCurrent();
  } else {
    toast(`${m.from_user?.nickname || '新'}：${m.msg_type === 2 ? '[图片]' : m.content}`);
  }
  loadConvs();
}

function onRecall(data) {
  const arr = state.messages[data.conv_id];
  if (arr) {
    const m = arr.find((x) => x.id === data.msg_id);
    if (m) m.status = 1;
    if (state.current && state.current.convId === data.conv_id) renderMessages();
  }
}

  $('contactList').style.display = tab === 'contacts' ? 'block' : 'none';
  $('momentEntry').style.display = tab === 'moments' ? 'block' : 'none';
  $('chatPlaceholder').style.display = 'none';
  $('chatInner').style.display = 'none';
  $('memberPanel').style.display = 'none';
  $('momentsView')?.remove();

  if (tab === 'moments') {
    // 朋友圈占用主区域
    const view = document.createElement('div');
    view.id = 'momentsView';
    view.className = 'moments';
    view.innerHTML = '<div class="empty">加载中…</div>';
    $('chatArea').appendChild(view);
    $('chatPlaceholder').style.display = 'none';
  }
}

document.querySelectorAll('.tab').forEach((t) => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach((x) => x.classList.remove('on'));
    t.classList.add('on');
    switchTab(t.dataset.tab);
    if (t.dataset.tab === 'convs') { state.current = null; loadConvs(); }
    if (t.dataset.tab === 'contacts') loadAll();
    if (t.dataset.tab === 'moments') loadTimeline();
  };
});

async function loadTimeline() {
  const view = $('momentsView');
  if (!view) return;
  try {
    state.moments = await api('GET', '/moments/timeline?limit=20') || [];
  } catch (e) {
    view.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
    return;
  }
  if (!state.moments.length) {
    view.innerHTML = '<div class="empty">朋友圈还很安静<br/>点左侧「发表动态」发布第一条吧</div>';
    return;
  }
  view.innerHTML = state.moments.map(renderMoment).join('');
}

function renderMoment(m) {
  const images = (m.images || []).map((u) => `<img src="${esc(u)}" onclick="window.open('${esc(u)}')" />`).join('');
  const likes = (m.likes || []);
  return `
    <div class="moment">
      <div class="moment-head">
        ${avatarHtml(m.user?.nickname, m.user?.avatar, 'avatar')}
        <div>
          <b>${esc(m.user?.nickname || '')}</b>
          <div class="muted">${fmtTime(m.created_at)}${m.is_mine ? ' · 我' : ''}</div>
        </div>
        <div class="spacer"></div>
        ${m.visibility === 3 ? '<span class="pill">仅自己可见</span>' : m.visibility === 1 ? '<span class="pill">公开</span>' : ''}
        ${m.is_mine ? `<button class="icon-btn" onclick="delMoment('${m.id}')" title="删除">🗑</button>` : ''}
      </div>
      <div class="moment-content">${esc(m.content)}</div>
      ${images ? `<div class="moment-images">${images}</div>` : ''}
      <div class="moment-actions">
        <button class="${m.liked ? 'liked' : ''}" onclick="toggleLike('${m.id}', ${m.liked})">
          ${m.liked ? '♥' : '♡'} ${m.like_count || 0}
        </button>
        <button onclick="focusComment('${m.id}')">💬 ${m.comment_count || 0}</button>
        <button onclick="openUserMoments('${m.user?.id}')">查看主页</button>
      </div>
      ${likes.length ? `<div class="likes">♥ ${likes.map((u) => esc(u.nickname)).join('、')}</div>` : ''}
      ${(m.comments || []).length ? `<div class="comments">${m.comments.map((c) => `
        <div class="comment">
          <b>${esc(c.user?.nickname || '')}</b>
          ${c.reply_to ? ` 回复 <b>${esc(c.reply_to.nickname)}</b>` : ''}：${esc(c.content)}
        </div>`).join('')}</div>` : ''}
      <div class="comment-input">
        <input id="ci_${m.id}" placeholder="写评论…" onkeydown="if(event.key==='Enter')addComment('${m.id}')" />
        <button class="btn sm" onclick="addComment('${m.id}')">发送</button>
      </div>
    </div>`;
}

function focusComment(id) {
  const el = $('ci_' + id);
  if (el) { el.focus(); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
}

async function toggleLike(id, liked) {
  try {
    if (liked) await api('DELETE', `/moments/${id}/like`);
    else await api('POST', `/moments/${id}/like`);
    await loadTimeline();
  } catch (e) { toast(e.message); }
}

async function addComment(id) {
  const el = $('ci_' + id);
  const content = el.value.trim();
  if (!content) return;
  try {
    await api('POST', `/moments/${id}/comments`, { content });
    el.value = '';
    await loadTimeline();
  } catch (e) { toast(e.message); }
}

async function delMoment(id) {
  if (!confirm('删除这条动态？')) return;
  try {
    await api('DELETE', '/moments/' + id);
    toast('已删除');
    await loadTimeline();
  } catch (e) { toast(e.message); }
}

async function openUserMoments(userId) {
  if (!userId) return;
  try {
    const list = await api('GET', `/moments/users/${userId}?limit=20`);
    openModal(`
      <h3>TA 的动态</h3>
      ${list.length ? list.map((m) => `
        <div class="moment" style="box-shadow:none;margin-bottom:10px">
          <div class="muted">${fmtTime(m.created_at)}</div>
          <div class="moment-content" style="margin-top:6px">${esc(m.content)}</div>
          ${(m.images || []).length ? `<div class="moment-images">${m.images.map((u) => `<img src="${esc(u)}" />`).join('')}</div>` : ''}
        </div>`).join('') : '<div class="empty">暂无动态</div>'}
      <div class="row" style="margin-top:12px"><div class="spacer"></div><button class="btn sm ghost" onclick="closeModal()">关闭</button></div>
    `);
  } catch (e) { toast(e.message); }
}

function openPublish() {
  openModal(`
    <h3>发表动态</h3>
    <div class="field">
      <textarea id="momentContent" placeholder="分享此刻…" style="width:100%;height:100px;border:1px solid var(--border);border-radius:10px;padding:10px;resize:vertical"></textarea>
    </div>
    <div class="field">
      <label>图片（最多 9 张）</label>
      <input type="file" id="momentFiles" accept="image/*" multiple />
    </div>
    <div class="field">
      <label>可见范围</label>
      <select id="momentVis" style="width:100%;height:38px;border:1px solid var(--border);border-radius:8px;padding:0 8px">
        <option value="1">公开</option>
        <option value="2" selected>仅好友可见</option>
        <option value="3">仅自己可见</option>
      </select>
    </div>
    <div class="row" style="margin-top:16px">
      <div class="spacer"></div>
      <button class="btn sm ghost" onclick="closeModal()">取消</button>
      <button class="btn sm" onclick="publishMoment()">发布</button>
    </div>
  `);
}

async function publishMoment() {
  const content = $('momentContent').value.trim();
  const files = Array.from($('momentFiles').files).slice(0, 9);
  const visibility = Number($('momentVis').value);
  if (!content && !files.length) { toast('写点什么或选张图'); return; }
  try {
    const images = [];
    for (const f of files) {
      const fd = new FormData();
      fd.append('file', f);
      const res = await fetch(API + '/upload', {
        method: 'POST', headers: { Authorization: 'Bearer ' + state.token }, body: fd,
      });
      const json = await res.json();
      if (json.code !== 0) throw new Error(json.msg);
      images.push(json.data.url);
    }
    await api('POST', '/moments', { content, images, visibility });
    closeModal();
    toast('已发布');
    openMoments();
  } catch (e) { toast(e.message); }
}

/* ---------------- 初始化 ---------------- */
(async function boot() {
  if (state.token) {
    try {
      state.me = await api('GET', '/users/me');
      enterApp();
      return;
    } catch (_) {
      state.token = '';
      localStorage.removeItem('imchat_token');
    }
  }
  $('login').style.display = 'flex';
})();
</script>
</body>
</html>
